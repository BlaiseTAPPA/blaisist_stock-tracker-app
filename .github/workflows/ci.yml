name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck & build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Dummy, non-secret values: they only let modules load during the build.
    # The build never connects to MongoDB (the client connects lazily), so
    # MONGODB_URI only has to be a well-formed URI. Never put real credentials here.
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      MONGODB_URI: mongodb://localhost:27017/fingenius-ci
      BETTER_AUTH_SECRET: ci-only-not-a-secret-0123456789abcdef
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_BASE_URL: http://localhost:3000
      FINNHUB_API_KEY: ci-dummy
      GEMINI_API_KEY: ci-dummy
      NODEMAILER_EMAIL: ci@example.com
      NODEMAILER_PASSWORD: ci-dummy

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
